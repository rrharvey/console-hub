[package]
name = "console-hub"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables the multiwebview API (several webviews in one window).
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.14"
tauri-plugin-dialog = "2"
sha2 = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
