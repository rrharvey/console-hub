<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Hub</title>
<style>
  :root {
    --bg: #f4f5f7; --fg: #1c2230; --muted: #6a7385; --line: #dfe2e8;
    --hover: #e8ebf0; --active: #dbe4f7; --accent: #3558c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181b22; --fg: #e6e9ef; --muted: #8b93a5; --line: #2a2f3a;
      --hover: #232834; --active: #26335a; --accent: #7d9bf2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: var(--muted); margin: 0; padding: 18px 16px 8px; }
  nav { flex: 1; overflow-y: auto; padding: 0 8px; }
  button {
    all: unset; display: block; width: 100%; padding: 8px 10px; border-radius: 6px;
    cursor: pointer; margin-bottom: 2px;
  }
  button:hover { background: var(--hover); }
  button.active { background: var(--active); color: var(--accent); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); }
  footer { padding: 12px 16px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
  #err { color: #c0392b; padding: 0 16px 8px; font-size: 11px; }
</style>
</head>
<body>
  <h1>Consoles</h1>
  <nav id="list"></nav>
  <div id="err"></div>
  <footer>Links only. No keys stored.</footer>
  <script src="vendors.js"></script>
  <script>
    const { invoke } = window.__TAURI__.core;
    const list = document.getElementById("list");
    const err = document.getElementById("err");

    async function select(vendor, btn) {
      err.textContent = "";
      try {
        if (vendor.external) {
          await invoke("open_in_browser", { url: vendor.url });
        } else {
          await invoke("show_vendor", { id: vendor.id, url: vendor.url });
          list.querySelectorAll("button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        }
      } catch (e) {
        err.textContent = String(e);
      }
    }

    window.VENDORS.forEach(v => {
      const b = document.createElement("button");
      b.textContent = v.external ? `${v.name} ↗` : v.name;
      b.title = v.external ? "Opens in your default browser" : "";
      b.addEventListener("click", () => select(v, b));
      list.appendChild(b);
    });

    // Open the first console on launch.
    list.querySelector("button")?.click();
  </script>
</body>
</html>
