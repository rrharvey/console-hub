<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Hub</title>
<style>
  :root {
    --bg: #f4f5f7; --fg: #1c2230; --muted: #6a7385; --line: #dfe2e8;
    --hover: #e8ebf0; --active: #dbe4f7; --accent: #3558c8; --warn: #b36b00; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181b22; --fg: #e6e9ef; --muted: #8b93a5; --line: #2a2f3a;
      --hover: #232834; --active: #26335a; --accent: #7d9bf2; --warn: #e0a040; --bad: #e57368;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: var(--muted); margin: 0; padding: 18px 16px 8px; }
  nav { flex: 1; overflow-y: auto; padding: 0 8px; }
  button { all: unset; cursor: pointer; border-radius: 6px; }
  button:focus-visible { outline: 2px solid var(--accent); }
  nav button {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    padding: 8px 10px; margin-bottom: 2px;
  }
  nav button:hover { background: var(--hover); }
  nav button.active { background: var(--active); color: var(--accent); font-weight: 600; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Credit balance, right-aligned next to the name. */
  .value { flex: none; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .value.loading, .value.unsupported { color: var(--muted); font-weight: 400; }
  .value.stale { opacity: .55; }
  .value.login { color: var(--warn); font-weight: 400; }
  .value.notfound, .value.error { color: var(--bad); font-weight: 400; }
  footer {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 8px 8px 16px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line);
  }
  #updated { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #refresh { padding: 2px 8px; font-size: 13px; }
  #refresh:hover { background: var(--hover); color: var(--fg); }
  #err { color: var(--bad); padding: 0 16px 8px; font-size: 11px; }
</style>
</head>
<body>
  <h1>Consoles</h1>
  <nav id="list"></nav>
  <div id="err"></div>
  <footer>
    <span id="updated"></span>
    <button id="refresh" title="Refresh balances">↻</button>
  </footer>
  <script src="vendors.js"></script>
  <script>
    const { invoke } = window.__TAURI__.core;
    const REFRESH_MS = 15 * 60 * 1000;
    const list = document.getElementById("list");
    const err = document.getElementById("err");
    const updated = document.getElementById("updated");
    // Balance cells by vendor id, for vendors that show one.
    const values = {};
    let lastRefresh = null;

    async function select(vendor, btn) {
      err.textContent = "";
      try {
        if (vendor.external) {
          await invoke("open_in_browser", { url: vendor.url });
        } else {
          await invoke("show_vendor", { id: vendor.id, url: vendor.url });
          list.querySelectorAll("button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        }
      } catch (e) {
        err.textContent = String(e);
      }
    }

    // The button tooltip: the vendor's own note, then the balance details.
    function setTip(v, lines) {
      const tip = [];
      if (v.external) tip.push("Opens in your default browser");
      if (v.balanceNote) tip.push(v.balanceNote);
      values[v.id].btn.title = [...tip, ...lines].join("\n");
    }

    window.VENDORS.forEach(v => {
      const b = document.createElement("button");
      b.innerHTML = `<span class="name"></span>`;
      b.querySelector(".name").textContent = v.external ? `${v.name} ↗` : v.name;
      if (!v.external && (v.balanceUrl || v.balanceNote)) {
        const value = document.createElement("span");
        value.className = v.balanceUrl ? "value loading" : "value unsupported";
        value.textContent = v.balanceUrl ? "…" : "—";
        b.appendChild(value);
        values[v.id] = { v, btn: b, value };
      }
      b.title = v.external ? "Opens in your default browser" : (v.balanceNote || "");
      b.addEventListener("click", () => select(v, b));
      b.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        invoke("vendor_menu", { url: v.url }).catch((e) => { err.textContent = String(e); });
      });
      list.appendChild(b);
    });

    // ---- credit balances ----------------------------------------------------------
    const LABELS = { loading: "…", login: "sign in", notfound: "not found", error: "error", unsupported: "—" };
    const ago = s => {
      const m = Math.round((Date.now() / 1000 - s) / 60);
      return m < 1 ? "just now" : m < 60 ? `${m}m ago` : `${Math.round(m / 60)}h ago`;
    };

    // Called from Rust (publish in main.rs) with one vendor's reading.
    window.onBalance = b => {
      const cell = values[b.id];
      if (!cell) return;
      // A failed refresh keeps showing the last good value, dimmed. "sign in" always
      // shows, since that needs action; the last value moves to the tooltip.
      const stale = b.status !== "ok" && b.status !== "login" && b.value;
      cell.value.className = `value ${stale ? "stale" : b.status}`;
      cell.value.textContent = b.status === "ok" || stale ? b.value : (LABELS[b.status] || b.status);
      const tip = [];
      if (b.status !== "ok") tip.push(`Status: ${LABELS[b.status] || b.status}`);
      if (b.status === "login" && b.value) tip.push(`Last balance: ${b.value}`);
      if (b.detail) tip.push(b.detail);
      if (b.updated) tip.push(`Read ${ago(b.updated)}`);
      if (b.url) tip.push(b.url);
      setTip(cell.v, tip);
    };

    function showUpdated() {
      updated.textContent = lastRefresh ? `Balances updated ${ago(lastRefresh)}` : "";
    }

    async function refresh() {
      lastRefresh = Date.now() / 1000;
      showUpdated();
      const targets = Object.values(values)
        .filter(c => c.v.balanceUrl)
        .map(c => ({ id: c.v.id, url: c.v.balanceUrl }));
      try {
        await invoke("refresh_balances", { targets });
      } catch (e) {
        updated.textContent = String(e);
      }
    }

    document.getElementById("refresh").addEventListener("click", refresh);

    // Open the first console on launch.
    list.querySelector("button")?.click();

    (async () => {
      // Show what Rust already has (e.g. after the sidebar reloads), then refresh.
      try { (await invoke("get_balances")).forEach(window.onBalance); } catch {}
      // Let the visible console start loading first.
      setTimeout(refresh, 1500);
      setInterval(refresh, REFRESH_MS);
      setInterval(showUpdated, 30 * 1000);
    })();
  </script>
</body>
</html>
