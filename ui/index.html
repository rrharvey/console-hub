<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Hub</title>
<style>
  :root {
    --bg: #f4f5f7; --fg: #1c2230; --muted: #6a7385; --line: #dfe2e8;
    --hover: #e8ebf0; --active: #dbe4f7; --accent: #3558c8; --warn: #b36b00; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181b22; --fg: #e6e9ef; --muted: #8b93a5; --line: #2a2f3a;
      --hover: #232834; --active: #26335a; --accent: #7d9bf2; --warn: #e0a040; --bad: #e57368;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    /* A shadow, not a border, so the divider takes no width and both sides stay even. */
    box-shadow: inset -1px 0 var(--line);
    user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 4px; padding: 14px 10px 4px 18px; }
  h1 { flex: 1; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: var(--muted); margin: 0; }
  #reload { padding: 3px 8px; font-size: 11px; color: var(--muted); }
  #reload:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
  #reload:disabled { opacity: .4; cursor: default; }
  nav { flex: 1; overflow-y: auto; padding: 0 8px; }
  /* `all: unset` also resets box-sizing, which would let width: 100% overflow the padding. */
  button { all: unset; box-sizing: border-box; cursor: pointer; border-radius: 6px; }
  button:focus-visible { outline: 2px solid var(--accent); }
  nav button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; margin-bottom: 2px;
  }
  nav button:hover { background: var(--hover); }
  nav button.active { background: var(--active); color: var(--accent); font-weight: 600; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Credit balance, right-aligned next to the name. */
  /* Same size as the name, so both sit on one line; a smaller balance looked low. */
  .value { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .value.loading { color: var(--muted); font-weight: 400; }
  .value.stale { opacity: .55; }
  .value.login, .value.review { color: var(--warn); font-weight: 400; }
  .value.notfound, .value.error { color: var(--bad); font-weight: 400; }
  footer {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 10px 8px 18px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line);
  }
  #updated { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer button { padding: 2px 8px; font-size: 13px; }
  footer button:hover { background: var(--hover); color: var(--fg); }
  .empty { color: var(--muted); margin: 4px 10px; font-size: 12px; line-height: 1.5; user-select: text; -webkit-user-select: text; }
  #err { color: var(--bad); padding: 0 18px 8px; font-size: 11px; white-space: pre-line; }
</style>
</head>
<body>
  <header>
    <h1>Consoles</h1>
    <button id="reload" title="Reload the open console" disabled>Reload page</button>
  </header>
  <nav id="list"></nav>
  <div id="err"></div>
  <footer>
    <span id="updated"></span>
    <button id="add" title="Add providers from a folder…">+</button>
    <button id="refresh" title="Refresh balances">↻</button>
  </footer>
  <script>
    const { invoke } = window.__TAURI__.core;
    const REFRESH_MS = 15 * 60 * 1000;
    const list = document.getElementById("list");
    const err = document.getElementById("err");
    const updated = document.getElementById("updated");
    const reload = document.getElementById("reload");
    // Balance cells by provider id, for providers that show one.
    let values = {};
    let activeId = null;
    let lastRefresh = null;

    async function select(provider, btn) {
      err.textContent = "";
      try {
        if (provider.review) {
          if (!(await invoke("review_provider", { id: provider.id }))) return;
          await window.onProvidersChanged();
          invoke("refresh_balances", { only: provider.id }).catch(() => {});
          list.querySelector(`[data-id="${provider.id}"]`)?.click();
        } else if (provider.external) {
          await invoke("open_in_browser", { url: provider.url });
        } else {
          await invoke("show_vendor", { id: provider.id, url: provider.url });
          activeId = provider.id;
          reload.disabled = false;
          list.querySelectorAll("button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        }
      } catch (e) {
        err.textContent = String(e);
      }
    }

    function addProvider(p) {
      const b = document.createElement("button");
      b.dataset.id = p.id;
      if (p.review) b.dataset.review = "";
      b.innerHTML = `<span class="name"></span>`;
      b.querySelector(".name").textContent = p.external ? `${p.name} ↗` : p.name;
      if (p.balance || p.review) {
        const value = document.createElement("span");
        value.className = p.review ? "value review" : "value loading";
        value.textContent = p.review ? "review" : "…";
        b.appendChild(value);
        if (p.balance) values[p.id] = { btn: b, value };
      }
      b.title = p.review ? "Added to your providers folder but not allowed yet. Click to review."
        : p.external ? "Opens in your default browser" : "";
      if (p.id === activeId && !p.review) b.classList.add("active");
      b.addEventListener("click", () => select(p, b));
      b.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        invoke("vendor_menu", { id: p.id, url: p.url }).catch((e) => { err.textContent = String(e); });
      });
      list.appendChild(b);
    }

    // Providers come from their plugin folders (providers.rs), sorted by name. Rebuilt when
    // one is allowed, added or removed; the open console stays selected.
    async function loadProviders() {
      try {
        const { providers, errors } = await invoke("list_providers");
        list.replaceChildren();
        values = {};
        providers.forEach(addProvider);
        if (!providers.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No providers yet. Click + below and choose a provider folder, "
            + "or the samples folder in the Console Hub repo to add several at once.";
          list.appendChild(empty);
        }
        // A provider that failed to load is left out; say which and why.
        err.textContent = errors.map(e => `Provider ${e}`).join("\n");
        const balances = await invoke("get_balances");
        balances.forEach(window.onBalance);
      } catch (e) {
        err.textContent = String(e);
      }
    }
    // Reopen the selected console (Rust may have closed it, see forget_provider in main.rs),
    // or the first one if the selected provider is gone.
    window.onProvidersChanged = async () => {
      await loadProviders();
      (list.querySelector(".active") || list.querySelector("button:not([data-review])"))?.click();
    };

    // ---- credit balances ----------------------------------------------------------
    const LABELS = { loading: "…", login: "sign in", notfound: "not found", error: "error" };
    const ago = s => {
      const m = Math.round((Date.now() / 1000 - s) / 60);
      return m < 1 ? "just now" : m < 60 ? `${m}m ago` : `${Math.round(m / 60)}h ago`;
    };

    // Called from Rust (publish in main.rs) with one provider's reading.
    window.onBalance = b => {
      const cell = values[b.id];
      if (!cell) return;
      // A failed refresh keeps showing the last good value, dimmed. "sign in" always
      // shows, since that needs action; the last value moves to the tooltip.
      const stale = b.status !== "ok" && b.status !== "login" && b.value;
      cell.value.className = `value ${stale ? "stale" : b.status}`;
      cell.value.textContent = b.status === "ok" || stale ? b.value : (LABELS[b.status] || b.status);
      const tip = [];
      if (b.status !== "ok") tip.push(`Status: ${LABELS[b.status] || b.status}`);
      if (b.status === "login" && b.value) tip.push(`Last balance: ${b.value}`);
      if (b.detail) tip.push(b.detail);
      if (b.updated) tip.push(`Read ${ago(b.updated)}`);
      if (b.url) tip.push(b.url);
      cell.btn.title = tip.join("\n");
    };

    function showUpdated() {
      updated.textContent = lastRefresh ? `Balances updated ${ago(lastRefresh)}` : "";
    }

    async function refresh() {
      lastRefresh = Date.now() / 1000;
      showUpdated();
      try {
        await invoke("refresh_balances", { only: null });
      } catch (e) {
        updated.textContent = String(e);
      }
    }

    document.getElementById("refresh").addEventListener("click", refresh);
    reload.addEventListener("click", async () => {
      err.textContent = "";
      try {
        await invoke("reload_vendor", { id: activeId });
      } catch (e) {
        err.textContent = String(e);
      }
    });
    document.getElementById("add").addEventListener("click", async () => {
      err.textContent = "";
      try {
        const ids = await invoke("add_provider");
        if (!ids.length) return;
        await window.onProvidersChanged();
        for (const id of ids) invoke("refresh_balances", { only: id }).catch(() => {});
        list.querySelector(`[data-id="${ids[0]}"]`)?.click();
      } catch (e) {
        err.textContent = String(e);
      }
    });

    (async () => {
      await loadProviders();
      // Open the first console on launch (skipping any waiting for review).
      list.querySelector("button:not([data-review])")?.click();
      // Let the visible console start loading first.
      setTimeout(refresh, 1500);
      setInterval(refresh, REFRESH_MS);
      setInterval(showUpdated, 30 * 1000);
    })();
  </script>
</body>
</html>
