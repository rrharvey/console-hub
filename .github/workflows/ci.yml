# Tests on every OS the team uses. Unit tests only: they compile the whole app for that
# OS, but nothing here opens a window (see INSTALL.md for the manual smoke test).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".agent/**"]
  # Every pull request, docs-only too: main requires these checks, and a skipped workflow
  # never reports them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Jobs take under 5 minutes; one still going at 10 is stuck (apt, a download).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # Normally about 30 seconds. Ubuntu's Azure mirror sometimes slows to a crawl;
        # fail early so the job can be re-run.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Rust tests (sandbox, manifests, sample fixtures, author tools)
        run: npm test
      - name: Type-check sample providers
        run: npm run check-js
      - name: Run sample providers through test-provider
        run: npm run test-provider -- samples
